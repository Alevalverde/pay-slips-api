openapi: 3.0.3
info:
  version: 1.0.0
  termsOfService: 'http://swagger.io/terms/'
  title: Pay-Slips-API
  license:
    name: ISC
  contact:
    name: Alejandro Valverde
    email: avalverde@midasconsultores.com.ar
paths:
  '/login':
    post:
      tags:
        - Auth
      summary: User login
      description: This endpoint allows a user to login
      operationId: login
      requestBody:
        $ref: '#/components/requestBodies/Login'
      responses:
        '200':
          $ref: '#/components/responses/SuccessLogin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/current-user':
    get:
      tags:
        - Auth
      summary: User verify token
      description: Checks if a user is authenticated by verifying the provided token.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/users/{id}/pay-slips':
    get:
      tags:
        - Pay Slips
      summary: Get pay slips by user id
      description: This endpoint returns an array of pay slips by user id
      operationId: getPaySlipByUser
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/year'
      responses:
        '200':
          $ref: '#/components/responses/GetPaySlipResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  '/pay-slips/{id}':
    get:
      tags:
        - Pay Slips
      summary: Get pay slip by id
      description: This endpoint returns data to the pay slip
      operationId: getPaySlip
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/DownloadPaySlipResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
    patch:
      tags:
        - Pay Slips
      summary: Update a pay slip by id
      description: This endpoint update a pay slip by id
      operationId: updatePaySlip
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        $ref: '#/components/requestBodies/UpdatePaySlip'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
    delete:
      tags:
        - Pay Slips
      summary: Remove a pay slip by id
      description: This endpoint remove a pay slip by id
      operationId: deletePaySlip
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  '/pay-slips':
    post:
      tags:
        - Pay Slips
      summary: Upload PDF file.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFiles'
      description: Upload PDF file of all pay slips per pay period.
      operationId: uploadPaySlipByMonth
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/users':
    post:
      tags:
        - Users
      summary: Create a new user
      description: This endpoint creates a new user
      operationId: CreateUser
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        '200':
          $ref: '#/components/responses/GetUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
    get:
      tags:
        - Users
      summary: Get all users.
      description: This endpoint returns a list of users with pagination
      operationId: getAllUser
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          $ref: '#/components/responses/GetAllUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  '/users/{id}':
    get:
      tags:
        - Users
      summary: Get user by id.
      description: This endpoint returns an user by id
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GetUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
    patch:
      tags:
        - Users
      summary: Update an user by id
      description: This endpoint update an user by id
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        '200':
          $ref: '#/components/responses/GetUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
    delete:
      tags:
        - Users
      summary: Remove an user by id
      description: This endpoint remove an user by id
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  '/news':
    get:
      tags:
        - News
      summary: Get all news.
      description: This endpoint returns a list of news
      operationId: getAllNews
      responses:
        '200':
          $ref: '#/components/responses/GetAllNewsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
servers:
  - url: '{protocol}://{domain}{port}/{baseUrl}/{apiVersion}'
    description: Default
    variables:
      protocol:
        enum:
          - http
          - https
        default: http
      domain:
        default: localhost
      port:
        default: ':8080'
      baseUrl:
        default: 'api'
      apiVersion:
        enum:
          - 'v1'
        default: 'v1'
components:
  requestBodies:
    Login:
      content:
        application/json:
          schema:
            type: object
            properties:
              cuil:
                type: string
                example: 12-34567899-0
              password:
                type: string
                example: El último 10
            required:
              - cuil
              - password
    CreateUser:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserBody'
            required: true
    UpdatePaySlip:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaySlipBody'
            required: true
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
    SuccessLogin:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
    CreateSuccess:
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSuccessResponse'
    Unauthorized:
      description: Access token is missing or is invalid
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DownloadPaySlipResponse:
      description: File
      content:
        application/pdf:
          schema:
            type: string
            format: binary
            description: PDF file
      headers:
        Content-Disposition:
          description: Indicates if file will be displayed or downloaded
          schema:
            type: string
            example: attachment; filename="Bonos de sueldo - SEPT 2024.pdf"
    GetUserResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/StandardResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Users'
                  message:
                    type: string
                    example: null
                    nullable: true
    GetAllNewsResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/StandardResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/News'
                  message:
                    type: string
                    example: null
                    nullable: true
    GetPaySlipResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/StandardResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaySlip'
                  message:
                    type: string
                    example: null
                    nullable: true
    GetAllUserResponse:
      description: Successful operation
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/StandardResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Users'
                  message:
                    type: string
                    example: null
                    nullable: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    BadRequestResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  status:
                    example: 400
                  message:
                    example: The date is invalid
    UnauthorizedResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  status:
                    example: 401
                  message:
                    example: Invalid username or password
    ForbiddenResponse:
      description: You do not have permission to access this resource
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  status:
                    example: 403
                  message:
                    example: You do not have permission to perform this action.
    InternalErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  status:
                    example: 500
                  message:
                    example: Internal server error
    InternalServerError:
      description: Internal server error
  schemas:
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginData'
    LoginData:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        userData:
          type: object
          properties:
            _id:
              type: string
              example: 65e09ad5f946ec037ca1d602
            cuil:
              type: string
              example: 23-12345678-1
            email:
              type: string
              example: qpepito@yopmail.com
            name: 
              type: string
              example: Riquelme, Juan Román
            roleUser:
              type: string
              example: user
            userType:
              type: array
              example: [Empleado, Titular de pago]
    UserBody:
      type: object
      properties:
        cuil:
          type: string
          example: 23-12345678-1
        name:
          type: string
          example: Riquelme, Juan Román
        status:
          type: boolean
          example: true
        userType:
          type: array
          example: [Empleado, Titular de pago]
        roleUser:
          type: string
          example: user
        password:
          type: string
          example: El último 10
        email:
          type: string
          example: riquelme@bocajuniors.com
        phone:
          type: string
          example: 1123456789
        address:
          type: string
          example: Brandsen 805
    PaySlip:
      type: object
      properties:
        _id:
          type: string
          example: 676daf02bdb8817b2961cd44
        name:
          type: string
          example: BS - ABR 2024 - Tello, Pepe
        month:
          type: string
          example: ABR
        year:
          type: string
          example: 2025
        userId:
          type: string
          example: 6769b8859b5de45dd4723334
        createdAt:
          type: string
          example: 2024-12-15T00:00:00.000Z
        updatedAt:
          type: string
          example: 2024-12-15T00:00:00.000Z
    PaySlipResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
    PaySlipBody:
      type: object
      properties:
        name:
          type: string
          example: BS - ABR 2024 - Tello, Pepe
        month:
          type: string
          example: ABR
        year:
          type: string
          example: 2025
        userId:
          type: string
          example: 6769b8859b5de45dd4723334
    CreateSuccessResponse:
      type: object
      properties:
        status:
          type: number
          example: 201
        message:
          type: string
          example: Successful operation
        data:
          example: null
    StandardResponse:
      type: object
      properties:
        status:
          type: number
          example: 200
        message:
          type: string
          example: 'Successful operation'
        data:
          anyOf:
            - type: object
            - type: array
      required:
        - status
        - message
        - data
    StandardResponseList:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
    Users:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        cuil:
          type: string
        createdAt:
          type: string
          example: 2024-12-15T00:00:00.000Z
        updatedAt:
          type: string
          example: 2024-12-15T00:00:00.000Z
    News:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        body:
          type: string
        footer:
          type: string
        img:
          type: string
        status:
          type: boolean
        date:
          type: string
          example: 2024-02-15T00:00:00.000Z
    UploadFiles:
      type: object
      properties:
        file:
          type: string
          format: binary
        nameFile:
          type: string
          enum:
            - BS
            - 1° SAC
            - 2° SAC
            - BOLETAS DE PAGO
        month:
          type: string
          enum:
            - ENE
            - FEB
            - MAR
            - ABR
            - MAY
            - JUN
            - JUL
            - AGO
            - SEP
            - OCT
            - NOV
            - DIC
        year:
          type: string
          example: 2025
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        status:
          type: number
          example: 500
        message:
          type: string
          example: Internal server error
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        status:
          type: number
          example: 400
    ErrorItem:
      type: object
      properties:
        key:
          type: string
          example: error.message.key
        message:
          type: string
          example: Error message example. Same as the outer 'message' property.
    Pagination:
      type: object
      properties:
        count:
          type: number
          example: 1
        page:
          type: number
          example: 1
        page_size:
          type: number
          example: 10
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    name:
      name: name
      in: query
      required: false
      schema:
        type: string
    year:
      name: year
      in: query
      required: false
      schema:
        type: string
    page:
      name: page
      in: query
      description: Page number
      schema:
        type: number
        default: 1
        minimum: 1
    page_size:
      name: page_size
      in: query
      description: Limit the number of results
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
    sort:
      name: sort
      in: query
      description: Attribute to sort by
      schema:
        type: string
        example: name
    sort_dir:
      name: sort_dir
      in: query
      description: Sorting direction
      schema:
        type: string
        enum:
          - ASC
          - DESC
    typeSort:
      name: typeSort
      in: query
      description: sorting by date or engagement
      schema:
        type: string
        enum:
          - engagement
          - date
